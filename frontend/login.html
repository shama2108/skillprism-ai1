<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillPrism AI - Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

    <div class="min-h-screen flex">

        <!-- Left Section -->
        <div class="hidden md:flex md:w-1/2 bg-indigo-600 text-white items-center justify-center">

            <div class="max-w-md text-center px-8">

                <h1 class="text-5xl font-bold mb-6">
                    SkillPrism AI
                </h1>

                <p class="text-lg">
                    AI-Powered Career Intelligence Platform
                </p>

            </div>

        </div>

        <!-- Right Section -->
        <div class="w-full md:w-1/2 flex items-center justify-center">

            <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">

                <h2 class="text-3xl font-bold mb-2">
                    Welcome Back
                </h2>

                <p class="text-gray-500 mb-6">
                    Sign in to continue
                </p>

                <form>

                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">
                            Email
                        </label>

                        <input
                            type="email"
                            placeholder="Enter email"
                            class="w-full border rounded-lg px-4 py-3"
                        >
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">
                            Password
                        </label>

                        <input
                            type="password"
                            placeholder="Enter password"
                            class="w-full border rounded-lg px-4 py-3"
                        >
                    </div>

                    <div class="flex justify-between mb-5 text-sm">

                        <label>
                            <input type="checkbox">
                            Remember Me
                        </label>

                        <a href="#" class="text-indigo-600">
                            Forgot Password?
                        </a>

                    </div>

                    <button
                        class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700"
                    >
                        Login
                    </button>

                </form>

                <p class="mt-5 text-center text-sm">

                    Don't have an account?

                    <a
                        href="register.html"
                        class="text-indigo-600 font-medium"
                    >
                        Register
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillPrism AI - Register</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

    <div class="min-h-screen flex">

        <!-- Left Section -->
        <div class="hidden md:flex md:w-1/2 bg-indigo-600 text-white items-center justify-center">

            <div class="max-w-md text-center px-8">

                <h1 class="text-5xl font-bold mb-6">
                    SkillPrism AI
                </h1>

                <p class="text-lg leading-relaxed">
                    Build your career with AI-powered resume analysis,
                    interview preparation and personalised learning roadmaps.
                </p>

            </div>

        </div>

        <!-- Right Section -->
        <div class="w-full md:w-1/2 flex items-center justify-center py-10">

            <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">

                <h2 class="text-3xl font-bold mb-2">
                    Create Account
                </h2>

                <p class="text-gray-500 mb-6">
                    Start your journey with SkillPrism AI
                </p>

                <form>

                    <!-- Name -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">
                            Full Name
                        </label>

                        <input
                            type="text"
                            placeholder="Enter your name"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">
                            Email Address
                        </label>

                        <input
                            type="email"
                            placeholder="Enter your email"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">
                            Password
                        </label>

                        <input
                            type="password"
                            placeholder="Create password"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            placeholder="Confirm password"
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                    </div>

                    <!-- Terms -->
                    <div class="mb-6 text-sm">

                        <label class="flex items-center gap-2">
                            <input type="checkbox">

                            <span>
                                I agree to the Terms & Conditions
                            </span>
                        </label>

                    </div>

                    <!-- Button -->
                    <button
                        type="submit"
                        class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition"
                    >
                        Create Account
                    </button>

                </form>

                <p class="text-center mt-6 text-sm">

                    Already have an account?

                    <a
                        href="login.html"
                        class="text-indigo-600 font-semibold"
                    >
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>
</html>
